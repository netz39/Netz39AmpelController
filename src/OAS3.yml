openapi: 3.0.0
info:
  title: Netz39 Ampel Controller API
  description: Microservice to provide the Controller for our Traffic Light and Space Status.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /v0/health:
    get:
      summary: Get health status
      description: >
        Returns the health status of the application.
        A temporary MQTT broker disconnection does not make the service unhealthy
        as long as the MQTT network loop is still running.
      responses:
        '200':
          description: A JSON object containing the health status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: The service is unhealthy because the MQTT network loop is not running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v0/oas3:
    get:
      summary: Get OpenAPI 3.0 specification
      description: Returns the OpenAPI 3.0 specification in plain text format.
      responses:
        '200':
          description: The OpenAPI 3.0 specification.
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        api_version:
          type: string
        git_version:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime:
          type: string
        mqtt_loop_running:
          type: boolean
          description: Whether the MQTT network loop is running.
        mqtt_connected:
          type: boolean
          description: Whether the MQTT client is currently connected to the broker.
